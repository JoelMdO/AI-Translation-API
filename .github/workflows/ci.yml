name: CI — Run Tests Before Deploy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  mocked-api-tests:
    name: Run mocked API tests (PR gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest pytest-asyncio httpx pytest-mock pytest-cov

      - name: Run mocked API / unit tests
        env:
          DEV_MODE: "true"
          TESTING_MODE: "true"
          ALLOWED_ORIGINS: '["*"]'
          OLLAMA_DEFAULT_MODEL: "test-model"
          OLLAMA_BASE_URL: "http://localhost:11434"
        run: |
          pytest tests --ignore=tests/integration -m "not integration" -v --cov=app --cov-report=term-missing
