name: CI — Run Tests Before Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest pytest-asyncio httpx pytest-mock pytest-cov

      - name: Run tests
        env:
          DEV_MODE: "true"
          ALLOWED_ORIGINS: '["*"]'
          OLLAMA_DEFAULT_MODEL: "test-model"
        run: |
          pytest tests/ --ignore=tests/integration -v --cov=app --cov-report=term-missing

  integration-test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: test

    services:
      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8001:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest pytest-asyncio httpx pytest-mock pytest-cov

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull tinyllama
        run: |
          ollama serve &
          for i in {1..30}; do
            if ollama list >/dev/null 2>&1; then
              echo "Ollama is ready"
              break
            fi
            echo "Waiting for Ollama... ($i)"
            sleep 2
          done
          ollama pull tinyllama

      - name: Start API
        env:
          DEV_MODE: "true"
          ALLOWED_ORIGINS: '["*"]'
          OLLAMA_BASE_URL: "http://localhost:11434"
          OLLAMA_DEFAULT_MODEL: "tinyllama"
          CHROMA_HOST: "localhost"
          CHROMA_PORT: "8001"
        run: |
          cd app
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "API is ready"
              break
            fi
            echo "Waiting for API... ($i)"
            sleep 2
          done

      - name: Run integration tests
        env:
          API_BASE_URL: "http://localhost:8000"
        run: |
          pytest tests/integration/ -m integration -v
