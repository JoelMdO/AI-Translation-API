name: CI — Run Tests Before Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest pytest-asyncio httpx pytest-mock pytest-cov

      - name: Run tests
        env:
          DEV_MODE: "true"
          ALLOWED_ORIGINS: '["*"]'
          OLLAMA_DEFAULT_MODEL: "test-model"
        run: |
          pytest tests/ --ignore=tests/integration -v --cov=app --cov-report=term-missing
